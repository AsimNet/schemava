name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  php-tests:
    name: PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, gd, bcmath, pdo_sqlite
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run PHPUnit
        run: vendor/bin/phpunit

  js-tests:
    name: JS build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JS dependencies
        run: npm ci
      - name: Build the form-builder bundle
        run: npm run build
      - name: Run vitest
        run: npm run test:js
      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --quiet -- resources/dist; then
            echo "::error::resources/dist is out of date — run 'npm run build' and commit the result."
            git --no-pager diff --stat -- resources/dist
            exit 1
          fi
