name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  php:
    name: PHP (install + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate composer.json
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Lint PHP sources
        run: find src config database -name '*.php' -print0 | xargs -0 -n1 php -l

  js:
    name: JS build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JS dependencies
        run: npm ci
      - name: Run vitest
        run: npm run test:js
      - name: Build the form-builder bundle
        run: npm run build
